<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Coding from Zero — Learning Platform</title>
  <desc id="desc">Project showcase for Platform Belajar Coding Dari Nol built with Next.js and TypeScript.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="428" rx="10"/></clipPath>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="430" fill="#0b0d12"/>
    <circle cx="880" cy="70" r="240" fill="#38bdf8" opacity=".05"/>

    <text x="42" y="44" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2">03 // DEVELOPER ROADMAPS</text>
    <text x="40" y="94" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-1.2">Coding from Zero</text>
    <text x="42" y="122" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Structured roadmaps and interactive foundational guides for aspiring developers.</text>

    <!-- App Mockup Window -->
    <rect x="42" y="154" width="916" height="236" rx="8" fill="#10141d" stroke="#1e293b"/>

    <!-- Editor Header -->
    <rect x="42" y="154" width="916" height="32" rx="8" fill="#141a26"/>
    <line x1="42" y1="186" x2="958" y2="186" stroke="#1e293b"/>
    <circle cx="62" cy="170" r="4" fill="#ef4444"/>
    <circle cx="76" cy="170" r="4" fill="#f59e0b"/>
    <circle cx="90" cy="170" r="4" fill="#10b981"/>
    <text x="500" y="174" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">guide-roadmap.ts</text>

    <!-- Code Editor Section -->
    <g transform="translate(62, 206)">
      <!-- Line Numbers -->
      <g fill="#475569" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5">
        <text x="0" y="16">01</text>
        <text x="0" y="38">02</text>
        <text x="0" y="60">03</text>
        <text x="0" y="82">04</text>
        <text x="0" y="104">05</text>
        <text x="0" y="126">06</text>
        <text x="0" y="148">07</text>
      </g>

      <!-- Code -->
      <g transform="translate(36, 0)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5">
        <text x="0" y="16"><tspan fill="#38bdf8">interface</tspan> <tspan fill="#f8fafc">LearningPath</tspan> {</text>
        <text x="18" y="38"><tspan fill="#94a3b8">stage:</tspan> <tspan fill="#38bdf8">'Foundations'</tspan> | <tspan fill="#38bdf8">'Engineering'</tspan> | <tspan fill="#38bdf8">'Shipping'</tspan>;</text>
        <text x="18" y="60"><tspan fill="#94a3b8">principles:</tspan> <tspan fill="#f8fafc">['Modular Architecture', 'Type Safety', 'Clean APIs']</tspan>;</text>
        <text x="18" y="82"><tspan fill="#94a3b8">handsOn:</tspan> <tspan fill="#34d399">true</tspan>;</text>
        <text x="0" y="104">}</text>
        <text x="0" y="132" fill="#64748b">// Build understanding through practical implementations.</text>
        <text x="0" y="152" fill="#64748b">// Focus on durable programming concepts over framework hype.</text>
      </g>
    </g>

    <!-- Right-hand roadmap card -->
    <g transform="translate(640, 204)">
      <rect x="0" y="0" width="290" height="162" rx="6" fill="#141a26" stroke="#1e293b"/>
      <text x="20" y="28" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13" font-weight="700">Milestone Progression</text>
      <text x="20" y="46" fill="#64748b" font-family="Inter, sans-serif" font-size="10.5">Sequential mastery from syntax to deployment</text>

      <!-- Step 1 -->
      <circle cx="28" cy="74" r="5" fill="#38bdf8"/>
      <line x1="28" y1="79" x2="28" y2="103" stroke="#1e293b" stroke-width="1.5"/>
      <text x="44" y="78" fill="#f8fafc" font-family="Inter, sans-serif" font-size="11" font-weight="600">01. Language Fundamentals</text>

      <!-- Step 2 -->
      <circle cx="28" cy="108" r="5" fill="#38bdf8"/>
      <line x1="28" y1="113" x2="28" y2="137" stroke="#1e293b" stroke-width="1.5"/>
      <text x="44" y="112" fill="#f8fafc" font-family="Inter, sans-serif" font-size="11" font-weight="600">02. Web Architecture &amp; APIs</text>

      <!-- Step 3 -->
      <circle cx="28" cy="142" r="5" fill="#2563eb"/>
      <text x="44" y="146" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11" font-weight="600">03. Full-Stack Production Deploy</text>
    </g>
  </g>

  <rect x=".75" y=".75" width="998.5" height="428.5" rx="10" fill="none" stroke="#1e293b" stroke-width="1.5"/>
</svg>