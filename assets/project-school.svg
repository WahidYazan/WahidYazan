<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">School Management SaaS — Multi-Tenant Academic Platform</title>
  <desc id="desc">Project showcase for School Management SaaS built with Laravel 13, PHP, and MySQL.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="428" rx="10"/></clipPath>
    <linearGradient id="schoolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="430" fill="#0b0d12"/>
    <circle cx="880" cy="70" r="240" fill="#38bdf8" opacity=".05"/>

    <text x="42" y="44" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2">04 // INSTITUTIONAL PLATFORM</text>
    <text x="40" y="94" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-1.2">School Management SaaS</text>
    <text x="42" y="122" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">A centralized administrative and academic management portal for educational institutions.</text>

    <!-- App Mockup Window -->
    <rect x="42" y="154" width="916" height="236" rx="8" fill="#10141d" stroke="#1e293b"/>
    <rect x="42" y="154" width="170" height="236" fill="#141a26"/>
    <line x1="212" y1="154" x2="212" y2="390" stroke="#1e293b"/>

    <!-- Sidebar Header -->
    <text x="62" y="186" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13" font-weight="800">CAMPUS // PORTAL</text>
    <line x1="60" y1="202" x2="194" y2="202" stroke="#1e293b"/>

    <!-- Nav Items -->
    <rect x="58" y="216" width="140" height="30" rx="4" fill="#1e293b"/>
    <rect x="58" y="216" width="3" height="30" fill="#38bdf8"/>
    <text x="74" y="235" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="700">Institution Info</text>
    <text x="74" y="268" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Student Records</text>
    <text x="74" y="296" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Faculty Roster</text>
    <text x="74" y="324" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Class Schedules</text>
    <text x="74" y="352" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Academic Reports</text>

    <!-- Main Content Area -->
    <text x="238" y="186" fill="#f8fafc" font-family="Inter, sans-serif" font-size="17" font-weight="800">Academic Administration</text>
    <text x="238" y="204" fill="#64748b" font-family="Inter, sans-serif" font-size="10.5">Role-based data access for administrators, instructors, and students</text>

    <!-- Stat 1 -->
    <rect x="238" y="220" width="220" height="64" rx="6" fill="#141a26" stroke="#1e293b"/>
    <text x="254" y="240" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600">ENROLLED STUDENTS</text>
    <text x="254" y="266" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="800">1,240</text>

    <!-- Stat 2 -->
    <rect x="474" y="220" width="220" height="64" rx="6" fill="#141a26" stroke="#1e293b"/>
    <text x="490" y="240" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600">ACTIVE COURSES</text>
    <text x="490" y="266" fill="#38bdf8" font-family="Inter, sans-serif" font-size="20" font-weight="800">48 Classes</text>

    <!-- Stat 3 -->
    <rect x="710" y="220" width="228" height="64" rx="6" fill="#141a26" stroke="#1e293b"/>
    <text x="726" y="240" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600">SYSTEM ARCHITECTURE</text>
    <text x="726" y="266" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="800">Laravel 13 · MySQL</text>

    <!-- Bottom summary row -->
    <rect x="238" y="300" width="700" height="66" rx="6" fill="#141a26" stroke="#1e293b"/>
    <text x="254" y="324" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700">MODULAR MODULES</text>
    <text x="254" y="348" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12">Course scheduling · Attendance ledger · Grade evaluation · Secure authentication &amp; RBAC permissions</text>
  </g>

  <rect x=".75" y=".75" width="998.5" height="428.5" rx="10" fill="none" stroke="#1e293b" stroke-width="1.5"/>
</svg>
