<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">FlowBill — Invoicing Platform</title>
  <desc id="desc">Project showcase for FlowBill invoice management web application built with Laravel and Tailwind CSS.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="428" rx="10"/></clipPath>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="430" fill="#0b0d12"/>
    <circle cx="880" cy="70" r="240" fill="#38bdf8" opacity=".05"/>

    <text x="42" y="44" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2">01 // PRODUCT ENGINEERING</text>
    <text x="40" y="94" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-1.2">FlowBill</text>
    <text x="42" y="122" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Full-cycle invoice management for freelancers and growing small businesses.</text>

    <!-- App Mockup Window -->
    <rect x="42" y="154" width="916" height="236" rx="8" fill="#10141d" stroke="#1e293b"/>
    <rect x="42" y="154" width="170" height="236" fill="#141a26"/>
    <line x1="212" y1="154" x2="212" y2="390" stroke="#1e293b"/>

    <!-- Sidebar Header -->
    <text x="62" y="186" fill="#f8fafc" font-family="Inter, sans-serif" font-size="14" font-weight="800">flowbill<tspan fill="#38bdf8">.</tspan></text>
    <line x1="60" y1="202" x2="194" y2="202" stroke="#1e293b"/>

    <!-- Nav Items -->
    <rect x="58" y="216" width="140" height="30" rx="4" fill="#1e293b"/>
    <rect x="58" y="216" width="3" height="30" fill="#38bdf8"/>
    <text x="74" y="235" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="700">Overview</text>
    <text x="74" y="268" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Invoices</text>
    <text x="74" y="296" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Customers</text>
    <text x="74" y="324" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Analytics</text>
    <text x="74" y="352" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Settings</text>

    <!-- Main Content Area -->
    <text x="238" y="186" fill="#f8fafc" font-family="Inter, sans-serif" font-size="17" font-weight="800">Dashboard Overview</text>
    <text x="238" y="204" fill="#64748b" font-family="Inter, sans-serif" font-size="10.5">Real-time revenue metrics and billing lifecycle</text>

    <!-- Metric Cards -->
    <rect x="238" y="220" width="210" height="64" rx="6" fill="#141a26" stroke="#1e293b"/>
    <text x="254" y="240" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600">TOTAL REVENUE</text>
    <text x="254" y="266" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="800">Rp 24.8M</text>

    <rect x="464" y="220" width="210" height="64" rx="6" fill="#141a26" stroke="#1e293b"/>
    <text x="480" y="240" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600">PENDING PAYMENTS</text>
    <text x="480" y="266" fill="#38bdf8" font-family="Inter, sans-serif" font-size="20" font-weight="800">Rp 6.2M</text>

    <rect x="690" y="220" width="248" height="64" rx="6" fill="#141a26" stroke="#1e293b"/>
    <text x="706" y="240" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" font-weight="600">ACTIVE CLIENTS</text>
    <text x="706" y="266" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="800">18 Accounts</text>

    <!-- Table Preview -->
    <text x="238" y="312" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11.5" font-weight="700">Recent Transactions</text>
    <line x1="238" y1="322" x2="938" y2="322" stroke="#1e293b"/>

    <text x="238" y="340" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5">INV-008</text>
    <text x="390" y="340" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">Studio North Creative</text>
    <text x="600" y="340" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10">Rp 2.400.000</text>
    
    <rect x="800" y="328" width="58" height="18" rx="4" fill="#064e3b"/>
    <text x="829" y="341" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="9" font-weight="700">PAID</text>

    <text x="238" y="366" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5">INV-009</text>
    <text x="390" y="366" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">Nexus Media Labs</text>
    <text x="600" y="366" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10">Rp 4.750.000</text>
    
    <rect x="800" y="354" width="68" height="18" rx="4" fill="#1e3a8a"/>
    <text x="834" y="367" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="9" font-weight="700">PENDING</text>
  </g>

  <rect x=".75" y=".75" width="998.5" height="428.5" rx="10" fill="none" stroke="#1e293b" stroke-width="1.5"/>
</svg>