<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">LMS TKA / PPLG — Learning Management Platform</title>
  <desc id="desc">Project showcase for LMS TKA PPLG built with Next.js, React, TypeScript, and Tailwind CSS.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="428" rx="10"/></clipPath>
    <linearGradient id="lmsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="430" fill="#0b0d12"/>
    <circle cx="880" cy="70" r="240" fill="#2563eb" opacity=".06"/>

    <text x="42" y="44" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2">02 // EDUCATION TECHNOLOGY</text>
    <text x="40" y="94" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-1.2">LMS TKA — PPLG</text>
    <text x="42" y="122" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">A structured learning platform engineered for software engineering students.</text>

    <!-- App Mockup Window -->
    <rect x="42" y="154" width="916" height="236" rx="8" fill="#10141d" stroke="#1e293b"/>
    <rect x="42" y="154" width="170" height="236" fill="#141a26"/>
    <line x1="212" y1="154" x2="212" y2="390" stroke="#1e293b"/>

    <!-- Sidebar Header -->
    <text x="62" y="186" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13" font-weight="800">LEARN // PPLG</text>
    <line x1="60" y1="202" x2="194" y2="202" stroke="#1e293b"/>

    <!-- Nav Items -->
    <rect x="58" y="216" width="140" height="30" rx="4" fill="#1e293b"/>
    <rect x="58" y="216" width="3" height="30" fill="#38bdf8"/>
    <text x="74" y="235" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" font-weight="700">Course Syllabus</text>
    <text x="74" y="268" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Assignments</text>
    <text x="74" y="296" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Code Exercises</text>
    <text x="74" y="324" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Documentation</text>
    <text x="74" y="352" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Submissions</text>

    <!-- Main Content Area -->
    <text x="238" y="186" fill="#f8fafc" font-family="Inter, sans-serif" font-size="17" font-weight="800">Software Curriculum Modules</text>
    <text x="238" y="204" fill="#64748b" font-family="Inter, sans-serif" font-size="10.5">Interactive track for web engineering and database modeling</text>

    <!-- Module Card 1 -->
    <rect x="238" y="220" width="220" height="145" rx="6" fill="#141a26" stroke="#1e293b"/>
    <rect x="252" y="234" width="36" height="36" rx="6" fill="#1e293b"/>
    <text x="270" y="257" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700">&lt;/&gt;</text>
    <text x="252" y="292" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13" font-weight="700">Frontend Foundations</text>
    <text x="252" y="310" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10.5">Next.js &amp; TypeScript architecture</text>
    <rect x="252" y="328" width="190" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="252" y="328" width="140" height="5" rx="2.5" fill="#38bdf8"/>

    <!-- Module Card 2 -->
    <rect x="474" y="220" width="220" height="145" rx="6" fill="#141a26" stroke="#1e293b"/>
    <rect x="488" y="234" width="36" height="36" rx="6" fill="#1e293b"/>
    <text x="506" y="257" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700">DB</text>
    <text x="488" y="292" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13" font-weight="700">Relational Modeling</text>
    <text x="488" y="310" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10.5">PostgreSQL &amp; MySQL schemas</text>
    <rect x="488" y="328" width="190" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="488" y="328" width="90" height="5" rx="2.5" fill="#38bdf8"/>

    <!-- Module Card 3 -->
    <rect x="710" y="220" width="228" height="145" rx="6" fill="#141a26" stroke="#1e293b"/>
    <rect x="724" y="234" width="36" height="36" rx="6" fill="#1e293b"/>
    <text x="742" y="257" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700">API</text>
    <text x="724" y="292" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13" font-weight="700">REST API Integration</text>
    <text x="724" y="310" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10.5">Authentication &amp; endpoints</text>
    <rect x="724" y="328" width="198" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="724" y="328" width="170" height="5" rx="2.5" fill="#38bdf8"/>
  </g>

  <rect x=".75" y=".75" width="998.5" height="428.5" rx="10" fill="none" stroke="#1e293b" stroke-width="1.5"/>
</svg>