<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Hidayat Nur Wahid — Technical Toolkit</title>
  <desc id="desc">Categorized full-stack development toolkit across frontend, backend, databases, and infrastructure.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="278" rx="12"/></clipPath>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="#0b0d12"/>
    <rect x="0" y="0" width="5" height="280" fill="url(#blueAccent)"/>

    <!-- Section Header -->
    <text x="44" y="44" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2">02 // TECHNICAL MATRIX</text>
    <text x="44" y="70" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Verified Technical Toolkit</text>
    <text x="310" y="70" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Pragmatic technologies applied across production code and active projects.</text>
    <line x1="44" y1="90" x2="1156" y2="90" stroke="#1e293b" stroke-width="1"/>

    <!-- Four Columns / Grid Quadrants -->
    <g transform="translate(44, 114)">
      <!-- 01 Backend -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.5">01. BACKEND ARCHITECTURE</text>
        <rect x="0" y="12" width="250" height="110" rx="6" fill="#10141d" stroke="#1e293b"/>
        <text x="16" y="38" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13.5" font-weight="600">PHP · Laravel 13</text>
        <text x="16" y="62" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13.5" font-weight="500">Node.js · Java</text>
        <text x="16" y="86" fill="#64748b" font-family="Inter, sans-serif" font-size="12">REST APIs · Auth · Architecture</text>
        <circle cx="230" cy="34" r="3" fill="#38bdf8"/>
      </g>

      <!-- 02 Frontend -->
      <g transform="translate(285, 0)">
        <text x="0" y="0" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.5">02. FRONTEND ENGINEERING</text>
        <rect x="0" y="12" width="250" height="110" rx="6" fill="#10141d" stroke="#1e293b"/>
        <text x="16" y="38" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13.5" font-weight="600">React · Next.js</text>
        <text x="16" y="62" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13.5" font-weight="500">TypeScript · JavaScript</text>
        <text x="16" y="86" fill="#64748b" font-family="Inter, sans-serif" font-size="12">Tailwind CSS · Responsive UI</text>
        <circle cx="230" cy="34" r="3" fill="#38bdf8"/>
      </g>

      <!-- 03 Databases -->
      <g transform="translate(570, 0)">
        <text x="0" y="0" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.5">03. DATA &amp; STORAGE</text>
        <rect x="0" y="12" width="250" height="110" rx="6" fill="#10141d" stroke="#1e293b"/>
        <text x="16" y="38" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13.5" font-weight="600">PostgreSQL · MySQL</text>
        <text x="16" y="62" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13.5" font-weight="500">MariaDB · MongoDB</text>
        <text x="16" y="86" fill="#64748b" font-family="Inter, sans-serif" font-size="12">SQLite · Schema Modeling</text>
        <circle cx="230" cy="34" r="3" fill="#38bdf8"/>
      </g>

      <!-- 04 Mobile & DevOps -->
      <g transform="translate(855, 0)">
        <text x="0" y="0" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.5">04. MOBILE &amp; DEVOPS</text>
        <rect x="0" y="12" width="255" height="110" rx="6" fill="#10141d" stroke="#1e293b"/>
        <text x="16" y="38" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13.5" font-weight="600">Kotlin · Flutter</text>
        <text x="16" y="62" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="13.5" font-weight="500">Git · GitHub · Linux</text>
        <text x="16" y="86" fill="#64748b" font-family="Inter, sans-serif" font-size="12">Docker · Self-Hosting</text>
        <circle cx="235" cy="34" r="3" fill="#38bdf8"/>
      </g>
    </g>

    <!-- Footer caption -->
    <text x="44" y="258" fill="#475569" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.2">NO EXAGGERATED PROFICIENCY RATINGS // FOCUSED ON ACCURATE APPLICATION &amp; PRACTICAL SHIPMENT</text>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="278.5" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>
</svg>