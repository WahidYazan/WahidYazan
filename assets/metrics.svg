<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-labelledby="title desc">
  <title id="title">Profile Metrics and Specialization</title>
  <desc id="desc">Engineering metrics and architectural focus overview for Hidayat Nur Wahid.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="128" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="130" fill="#0b0d12"/>

    <!-- Grid Columns -->
    <g transform="translate(44, 24)">
      <!-- Col 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.5">REPOSITORIES</text>
        <text x="0" y="46" fill="#f8fafc" font-family="Inter, sans-serif" font-size="24" font-weight="800">12 Public</text>
        <text x="0" y="70" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11.5">Full-Stack &amp; Learning Repos</text>
      </g>
      <line x1="250" y1="4" x2="250" y2="76" stroke="#1e293b"/>

      <!-- Col 2 -->
      <g transform="translate(285, 0)">
        <text x="0" y="14" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.5">BACKEND CORE</text>
        <text x="0" y="46" fill="#f8fafc" font-family="Inter, sans-serif" font-size="24" font-weight="800">Laravel · Node</text>
        <text x="0" y="70" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11.5">PHP, Java, REST APIs &amp; Auth</text>
      </g>
      <line x1="535" y1="4" x2="535" y2="76" stroke="#1e293b"/>

      <!-- Col 3 -->
      <g transform="translate(570, 0)">
        <text x="0" y="14" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.5">FRONTEND CORE</text>
        <text x="0" y="46" fill="#f8fafc" font-family="Inter, sans-serif" font-size="24" font-weight="800">Next.js · React</text>
        <text x="0" y="70" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11.5">TypeScript &amp; Tailwind CSS</text>
      </g>
      <line x1="820" y1="4" x2="820" y2="76" stroke="#1e293b"/>

      <!-- Col 4 -->
      <g transform="translate(855, 0)">
        <text x="0" y="14" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.5">SYSTEM RUNTIME</text>
        <text x="0" y="46" fill="#f8fafc" font-family="Inter, sans-serif" font-size="24" font-weight="800">Linux · Docker</text>
        <text x="0" y="70" fill="#34d399" font-family="Inter, sans-serif" font-size="11.5">PostgreSQL, MySQL, MariaDB</text>
      </g>
    </g>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="128.5" rx="10" fill="none" stroke="#1e293b" stroke-width="1.5"/>
</svg>
