<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hidayat Nur Wahid — Full-Stack Developer</title>
  <desc id="desc">A dark, minimal developer profile banner with cyan accents and an abstract code terminal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b121b"/>
      <stop offset="0.58" stop-color="#0d1722"/>
      <stop offset="1" stop-color="#101f2b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#9bb6cb" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="358" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="1010" cy="75" r="300" fill="url(#glow)"/>
    <path d="M760 0L1200 0 1200 360 1065 360Z" fill="#0b1722" opacity=".62"/>
    <path d="M760 0L1065 360" stroke="#7dd3fc" stroke-opacity=".08" stroke-width="1.5"/>
    <path d="M840 0L1145 360" stroke="#7dd3fc" stroke-opacity=".05" stroke-width="1.5"/>

    <rect x="62" y="58" width="34" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="108" y="64" fill="#8ba4b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.2">DEVELOPER PROFILE / 2026</text>

    <text x="60" y="139" fill="#f0f7fc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="51" font-weight="750" letter-spacing="-1.9">Hidayat Nur Wahid</text>
    <text x="63" y="183" fill="#b7c9d8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24" font-weight="500">Full-Stack Web Developer</text>
    <text x="63" y="222" fill="#91a8ba" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">Building useful products with thoughtful code and clean interfaces.</text>

    <g transform="translate(63 258)">
      <rect width="131" height="31" rx="8" fill="#122534" stroke="#2a4658"/>
      <text x="65.5" y="20" text-anchor="middle" fill="#c4eaf5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">WEB APPS</text>
      <rect x="141" width="132" height="31" rx="8" fill="#122534" stroke="#2a4658"/>
      <text x="207" y="20" text-anchor="middle" fill="#c4eaf5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">BACKEND</text>
      <rect x="283" width="145" height="31" rx="8" fill="#122534" stroke="#2a4658"/>
      <text x="355.5" y="20" text-anchor="middle" fill="#c4eaf5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">INFRASTRUCTURE</text>
    </g>

    <g transform="translate(780 64)">
      <rect width="352" height="234" rx="16" fill="#0b131c" stroke="#2a4050" stroke-width="1.2"/>
      <path d="M0 48H352" stroke="#263947"/>
      <circle cx="22" cy="24" r="4" fill="#fb7185"/>
      <circle cx="38" cy="24" r="4" fill="#fbbf24"/>
      <circle cx="54" cy="24" r="4" fill="#34d399"/>
      <text x="176" y="28" text-anchor="middle" fill="#7792a7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">building.web</text>

      <text x="24" y="79" fill="#6b879b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">01</text>
      <text x="52" y="79" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">const</text>
      <text x="96" y="79" fill="#d9e6ef" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">build =</text>
      <text x="155" y="79" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">({ product }) =&gt; {</text>

      <text x="24" y="111" fill="#6b879b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">02</text>
      <text x="72" y="111" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">design</text>
      <text x="120" y="111" fill="#d9e6ef" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">with purpose;</text>

      <text x="24" y="143" fill="#6b879b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">03</text>
      <text x="72" y="143" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">engineer</text>
      <text x="142" y="143" fill="#d9e6ef" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">for reliability;</text>

      <text x="24" y="175" fill="#6b879b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">04</text>
      <text x="72" y="175" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">refine</text>
      <text x="119" y="175" fill="#d9e6ef" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">every detail;</text>

      <text x="24" y="207" fill="#6b879b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">05</text>
      <text x="52" y="207" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">};</text>
      <rect x="75" y="197" width="7" height="15" rx="1" fill="#22d3ee" opacity=".8"/>
      <circle cx="317" cy="207" r="3" fill="#22d3ee"/>
      <text x="307" y="211" text-anchor="end" fill="#628398" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10">READY TO SHIP</text>
    </g>
    <text x="62" y="328" fill="#6f879a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.1">JAVA • PHP • TYPESCRIPT • LINUX</text>
    <path d="M1026 327H1138" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="358.5" rx="22" fill="none" stroke="#284051" stroke-width="1.5"/>
</svg>