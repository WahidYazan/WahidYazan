<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Hidayat Nur Wahid — Full-Stack Developer</title>
  <desc id="desc">Developer header for Hidayat Nur Wahid featuring a dark aesthetic with subtle electric blue accents.</desc>
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="258" rx="12"/></clipPath>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <radialGradient id="cornerGlow" cx="10%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b0d12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Deep dark background -->
    <rect width="1200" height="260" fill="#0b0d12"/>
    <rect width="1200" height="260" fill="url(#cornerGlow)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>

    <!-- Left accent bar -->
    <rect x="0" y="0" width="5" height="260" fill="url(#blueGlow)"/>

    <!-- Top micro-tag -->
    <g transform="translate(48, 42)">
      <rect x="0" y="0" width="7" height="7" rx="1.5" fill="#38bdf8"/>
      <text x="16" y="7.5" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2.2">HNW // DEVELOPER PROFILE</text>
      <text x="260" y="7.5" fill="#475569" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">|</text>
      <text x="278" y="7.5" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.5">FULL-STACK ENGINEER</text>
    </g>

    <!-- Main Title -->
    <text x="48" y="106" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-1.2">Hidayat Nur Wahid</text>

    <!-- Engineering Tagline -->
    <text x="48" y="142" fill="#cbd5e1" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" letter-spacing="-0.2">Architecting reliable backend systems, modular APIs, and responsive interfaces.</text>

    <!-- Subtle divider line -->
    <line x1="48" y1="172" x2="720" y2="172" stroke="#1e293b" stroke-width="1"/>

    <!-- Tech focus pills -->
    <g transform="translate(48, 202)">
      <!-- Item 1 -->
      <rect x="0" y="-14" width="78" height="22" rx="4" fill="#131a26" stroke="#1e293b"/>
      <text x="39" y="1" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1">LARAVEL</text>

      <!-- Item 2 -->
      <rect x="88" y="-14" width="76" height="22" rx="4" fill="#131a26" stroke="#1e293b"/>
      <text x="126" y="1" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1">NEXT.JS</text>

      <!-- Item 3 -->
      <rect x="174" y="-14" width="68" height="22" rx="4" fill="#131a26" stroke="#1e293b"/>
      <text x="208" y="1" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1">REACT</text>

      <!-- Item 4 -->
      <rect x="252" y="-14" width="98" height="22" rx="4" fill="#131a26" stroke="#1e293b"/>
      <text x="301" y="1" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1">TYPESCRIPT</text>

      <!-- Item 5 -->
      <rect x="360" y="-14" width="102" height="22" rx="4" fill="#131a26" stroke="#1e293b"/>
      <text x="411" y="1" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1">POSTGRESQL</text>

      <!-- Item 6 -->
      <rect x="472" y="-14" width="74" height="22" rx="4" fill="#131a26" stroke="#1e293b"/>
      <text x="509" y="1" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1">DOCKER</text>
    </g>

    <!-- Right Side Status Panel -->
    <g transform="translate(800, 32)">
      <rect x="0" y="0" width="350" height="196" rx="8" fill="#10141d" stroke="#1e293b"/>
      <rect x="0" y="0" width="350" height="30" rx="8" fill="#151b27"/>
      <line x1="0" y1="30" x2="350" y2="30" stroke="#1e293b" stroke-width="1"/>
      
      <!-- Window dots -->
      <circle cx="16" cy="15" r="4" fill="#334155"/>
      <circle cx="30" cy="15" r="4" fill="#334155"/>
      <circle cx="44" cy="15" r="4" fill="#334155"/>
      <text x="62" y="19" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="600">developer.config.json</text>

      <!-- Terminal content -->
      <g transform="translate(20, 52)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5">
        <text x="0" y="14" fill="#64748b">role:</text>
        <text x="75" y="14" fill="#38bdf8">"Full-Stack Developer"</text>

        <text x="0" y="38" fill="#64748b">scope:</text>
        <text x="75" y="38" fill="#f8fafc">"Web, API &amp; Databases"</text>

        <text x="0" y="62" fill="#64748b">core:</text>
        <text x="75" y="62" fill="#94a3b8">["Laravel", "Next.js"]</text>

        <text x="0" y="86" fill="#64748b">status:</text>
        <text x="75" y="86" fill="#34d399">"building &amp; shipping"</text>

        <text x="0" y="110" fill="#64748b">github:</text>
        <text x="75" y="110" fill="#cbd5e1">"@WahidYazan"</text>
      </g>
    </g>
  </g>

  <!-- Border line -->
  <rect x=".75" y=".75" width="1198.5" height="258.5" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>
</svg>