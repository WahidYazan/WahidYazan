<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Hidayat Nur Wahid</title>
  <desc id="desc">Full-Stack Developer header banner</desc>
  <defs>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="softGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background matching GitHub dark theme -->
  <rect width="1200" height="180" rx="10" fill="#0d1117"/>
  <rect width="1200" height="180" rx="10" fill="url(#softGlow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="180" rx="2" fill="url(#blueAccent)"/>

  <!-- Content -->
  <g transform="translate(60, 48)">
    <!-- Subtitle / Tag -->
    <text x="0" y="0" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="2">// FULL-STACK DEVELOPER</text>
    
    <!-- Name -->
    <text x="0" y="38" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.8">Hidayat Nur Wahid</text>

    <!-- Tagline -->
    <text x="0" y="70" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="15" font-weight="400">Crafting clean web applications, scalable backend APIs, and modern user experiences.</text>
  </g>

  <!-- Right status pill -->
  <g transform="translate(980, 50)">
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <circle cx="20" cy="17" r="4.5" fill="#3fb950"/>
    <text x="34" y="21" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="500">Available to Build</text>
  </g>

  <!-- Clean border -->
  <rect x="0.5" y="0.5" width="1199" height="179" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>