<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Hidayat Nur Wahid — Full-stack web developer</title>
  <desc id="desc">A restrained charcoal and sage portfolio banner with a geometric HN monogram.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101512"/>
      <stop offset="1" stop-color="#17211b"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#b8d0c0" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d0e5d5"/>
      <stop offset="1" stop-color="#90b7a0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#background)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <path d="M760 -40L1000 340M815 -40L1055 340M870 -40L1110 340M925 -40L1165 340M980 -40L1220 340" fill="none" stroke="#a5c8b1" stroke-opacity=".055" stroke-width="1"/>
    <path d="M786 0V300" stroke="#34463b" stroke-width="1"/>
    <path d="M64 47H98" stroke="url(#sage)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="110" y="51" fill="#9aafa1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2">SOFTWARE DEVELOPMENT / PORTFOLIO</text>

    <text x="62" y="120" fill="#f0f4f0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="47" font-weight="700" letter-spacing="-1.5">Hidayat Nur Wahid</text>
    <text x="65" y="158" fill="#c2dfcb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="600" letter-spacing=".5">FULL-STACK WEB DEVELOPER</text>
    <text x="65" y="192" fill="#a8b6ac" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15.5">Practical software. Thoughtful interfaces. Reliable foundations.</text>

    <g transform="translate(65 229)">
      <text x="0" y="0" fill="#84978b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" letter-spacing="1.25">LARAVEL</text>
      <circle cx="79" cy="-4" r="2" fill="#789d86"/>
      <text x="92" y="0" fill="#84978b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" letter-spacing="1.25">NEXT.JS</text>
      <circle cx="167" cy="-4" r="2" fill="#789d86"/>
      <text x="180" y="0" fill="#84978b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" letter-spacing="1.25">APPLICATIONS &amp; INFRASTRUCTURE</text>
    </g>

    <g transform="translate(982 148)">
      <circle r="91" fill="#17231c" fill-opacity=".5" stroke="#405747" stroke-width="1"/>
      <circle r="72" fill="none" stroke="#6d8b76" stroke-opacity=".7" stroke-width="1"/>
      <circle r="56" fill="none" stroke="#94b49d" stroke-opacity=".23" stroke-width="1"/>
      <path d="M-108 0H-74M74 0H108M0 -108V-74M0 74V108" stroke="#a6c9b1" stroke-opacity=".55" stroke-width="1.2"/>
      <path d="M-35 -30H-43V30H-35M35 -30H43V30H35" fill="none" stroke="#8eb69b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="14" text-anchor="middle" fill="url(#sage)" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="400" letter-spacing="-1">HNW</text>
      <circle cx="64" cy="-65" r="3" fill="#c2dfcb"/>
      <circle cx="-65" cy="64" r="2.5" fill="#789d86"/>
    </g>
    <text x="1136" y="270" text-anchor="end" fill="#627769" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.4">BUILD / LEARN / REFINE</text>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="298.5" rx="18" fill="none" stroke="#314338" stroke-width="1.5"/>
</svg>